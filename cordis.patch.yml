# ============================================================================
# dsh-whale-baijie —— DSH bundle patch
# ============================================================================
# 这是插件的"挂载声明"。DSH 启动时按 bundle 层栈叠加各插件 patch，
# 本文件会把白姐桌宠挂件插入 Web profile 的配置树。
#
# 安装方式：
#   dsh plugin --profile web add dsh-whale-baijie
# 或本地开发安装：
#   dsh plugin --profile web add link:<本目录绝对路径>
# ============================================================================

- insert:
    - id: dsh-whale-baijie
      name: dsh-whale-baijie
